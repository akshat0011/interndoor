<!doctype html>
<meta charset="utf-8">
<!--
  THE LINKEDIN POST IMAGE — A JOB CHEAT SHEET (1 Oct 2026, second design).

  His brief: "the image should not look like a interndoor product but something
  genuinely useful for which the user will stop scrolling … dont use interndoor
  theme or elements". So: no dark board, no lime, no radar, no wordmark. A
  light, editorial card in the EMPLOYER's colour (read off its own logo by the
  renderer), carrying what a student wants before applying — the facts, the
  skills to put on a resume as a checklist, what the work is, one way to stand
  out. Something worth saving, which is what LinkedIn rewards.

  Rendered by src/licard.js (drawCard) into PATHS.liCards — never the repo.
  1080x1350, LinkedIn's 4:5 portrait. Every text node is filled with
  textContent. The logo is CONTAINED, never cropped.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111318; --ink-2:#4a4f5c; --ink-3:#7b8190; --rule:#e3e5ea;
    --paper:#fbfaf7; --white:#ffffff;
    --accent:#1f4fd8; --accent-ink:#ffffff; --accent-text:#1f4fd8; --accent-soft:#eef2fd;
    --font:'Inter',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  body{margin:0;background:#ddd}
  #card{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--font)}
  .top-bar{position:absolute;left:0;right:0;top:0;height:14px;background:var(--accent)}
  .main{position:absolute;inset:14px 0 0 0;padding:58px 72px 52px;display:flex;flex-direction:column;gap:34px}
  /* NO SECTION SHRINKS. In a flex column an overflowing page squeezes its
     children instead of overflowing, and the title's box collapsed to 13px
     with the title still inside it. Overflow is the renderer's job: it drops
     whole sections until the page fits. */
  .main > *{flex:none}

  .who{display:flex;align-items:center;gap:26px}
  .plate{width:116px;height:116px;flex:none;background:var(--white);border:1px solid var(--rule);border-radius:24px;padding:14px;
         display:flex;align-items:center;justify-content:center}
  .plate img{width:100%;height:100%;object-fit:contain;display:block}
  .who-t{min-width:0;display:flex;flex-direction:column;gap:12px}
  .co{font-weight:700;font-size:40px;letter-spacing:-.01em;line-height:1.05;white-space:nowrap;overflow:hidden}
  .pill{align-self:flex-start;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:21px;letter-spacing:.06em;
        text-transform:uppercase;border-radius:999px;padding:8px 18px}

  .ttl-box{max-height:250px;overflow:hidden}
  .ttl{font-weight:800;font-size:74px;letter-spacing:-.03em;line-height:1.04}

  .facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;border-top:2px solid var(--ink);padding-top:28px}
  .fact{min-width:0;display:flex;flex-direction:column;gap:6px}
  .fact span{font-size:19px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .fact b{font-size:32px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
  .fact.is-pay b{color:var(--accent-text)}
  .fact small{font-size:21px;font-weight:500;color:var(--ink-2)}

  .sec-h{font-size:21px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-text);margin-bottom:16px}
  .checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
  .check{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;min-width:0}
  .check i{flex:none;width:30px;height:30px;border:3px solid var(--ink);border-radius:7px;background:var(--white)}
  .check em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .does{display:flex;flex-direction:column;gap:12px}
  .do{display:flex;gap:14px;font-size:27px;line-height:1.3;color:var(--ink-2)}
  .do::before{content:'';flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:14px}

  .tip{background:var(--accent-soft);border-left:8px solid var(--accent);border-radius:14px;padding:22px 26px}
  .tip .sec-h{margin-bottom:10px}
  .tip p{font-size:28px;font-weight:500;line-height:1.35;color:var(--ink)}

  .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:24px;padding-top:22px;border-top:1px solid var(--rule)}
  .foot .go{font-size:26px;font-weight:700;color:var(--ink);white-space:nowrap}
  .foot .more{font-size:22px;font-weight:500;color:var(--ink-3);text-align:right}
</style>

<div id="card">
  <div class="top-bar"></div>
  <div class="main" id="main">
    <div class="who">
      <div class="plate" id="plate"><img id="logo" alt=""></div>
      <div class="who-t">
        <div class="co" id="co"></div>
        <div class="pill" id="pill"></div>
      </div>
    </div>
    <div class="ttl-box"><div class="ttl" id="ttl"></div></div>
    <div class="facts" id="facts"></div>
    <section id="skills-sec"><div class="sec-h" id="skills-h"></div><div class="checks" id="checks"></div></section>
    <section id="does-sec"><div class="sec-h">What you'd do</div><div class="does" id="does"></div></section>
    <section class="tip" id="tip-sec"><div class="sec-h">How to stand out</div><p id="tip"></p></section>
    <div class="foot"><div class="go">Apply link in the caption ↓</div><div class="more" id="more"></div></div>
  </div>
</div>
