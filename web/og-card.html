<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* The site's own tokens (web/public/styles.css, dark theme), copied by value:
     this page renders from file:// with no stylesheet of the site's to link. */
  :root {
    --ink:#fafafa; --ink-15:#e4e4e7; --ink-2:#b4b4bc; --ink-3:#92929b;
    --bg:#070708; --card:#131316; --card-2:#1c1c20; --rule:#26262c; --rule-2:#393940;
    --accent:#c8ff00; --accent-ink:#14170a;
    --ui:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Geist Mono',ui-monospace,Menlo,monospace;
  }
  * { box-sizing:border-box; margin:0; }
  body { margin:0; }

  #card {
    position:absolute; top:0; left:0; width:1200px; height:630px; overflow:hidden;
    background:var(--bg); color:var(--ink); font-family:var(--ui);
    padding:44px 52px 48px; display:flex; flex-direction:column; gap:30px;
  }

  /* ---- masthead: the site's header, scaled ---- */
  .top { display:flex; align-items:center; justify-content:space-between; flex:none; }
  .brand { display:flex; align-items:center; gap:14px; }
  .brand .mark { width:40px; height:40px; flex:none; }
  .brand .mark svg { width:100%; height:100%; display:block; overflow:visible; }
  .s-ring { fill:none; stroke:var(--accent); stroke-width:1.1; opacity:.3; }
  .s-sweep { fill:var(--accent); opacity:.3; }
  .s-dot { fill:var(--accent); }
  .word { font-weight:600; font-size:31px; letter-spacing:-.03em; line-height:1; }
  .status { display:flex; align-items:center; gap:12px; font-size:23px; font-weight:500;
            color:var(--ink-2); letter-spacing:-.01em; }
  .status i { width:10px; height:10px; border-radius:50%; background:var(--accent); flex:none; }

  /* ---- generic card: the board's hero ---- */
  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; }
  .hero h1 { font-weight:600; font-size:76px; line-height:1.04; letter-spacing:-.035em; max-width:1000px; }
  .hero p { margin-top:24px; font-size:30px; line-height:1.4; color:var(--ink-2); max-width:880px;
            letter-spacing:-.01em; }
  .hero p b { color:var(--ink); font-weight:500; }

  /* ---- pills and the one lime action, as on the site ---- */
  .foot { display:flex; align-items:center; gap:12px; flex:none; }
  .pill { display:inline-flex; align-items:center; height:52px; padding:0 22px; border-radius:999px;
          background:var(--card-2); border:1px solid var(--rule-2); color:var(--ink-15);
          font-size:23px; font-weight:500; letter-spacing:-.01em; white-space:nowrap; }
  /* Pay is the one fact the site colours (--cash is the accent). */
  .pill.pay { color:var(--accent); }
  .spacer { flex:1; }
  .go { display:inline-flex; align-items:center; gap:12px; height:60px; padding:0 30px;
        border-radius:999px; background:var(--accent); color:var(--accent-ink);
        font-size:25px; font-weight:600; letter-spacing:-.015em; white-space:nowrap; }
  .url { font-family:var(--mono); font-size:22px; color:var(--ink-3); margin-right:10px; }

  /* ---- job card: the board's role card ---- */
  .panel { flex:1; min-height:0; display:flex; flex-direction:column; justify-content:space-between;
           background:var(--card); border:1px solid var(--rule); border-radius:28px; padding:40px 42px; }
  .who { display:flex; gap:36px; align-items:flex-start; min-height:0; }
  /* CONTAIN, NEVER COVER. 462 logo files in every shape there is; cropping a
     trademark is simply wrong. White plate, because most marks are drawn on
     white. Big, because the employer's mark is the one thing a student
     recognises without reading. */
  .plate { width:184px; height:184px; flex:none; border-radius:26px; background:#fff;
           display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .plate img { width:100%; height:100%; object-fit:contain; padding:18px; }
  .plate.none { background:var(--card-2); border:1px solid var(--rule-2); }
  .plate.none span { font-size:64px; font-weight:600; letter-spacing:-.03em; color:var(--ink-2); }
  /* The fit loop needs a real ceiling or it is inert (it once compared a block
     to itself and shipped every headline at the floor). */
  .txt { flex:1; min-width:0; max-height:276px; overflow:hidden; display:flex; flex-direction:column; gap:12px; }
  .co { font-size:31px; font-weight:500; color:var(--ink-15); letter-spacing:-.015em;
        white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  h1.role { font-weight:600; font-size:70px; line-height:1.07; letter-spacing:-.035em;
            color:var(--ink); overflow-wrap:anywhere; }
</style>

<div id="card">
  <div class="top">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 44 44">
          <circle class="s-ring" cx="22" cy="22" r="20"/>
          <circle class="s-ring" cx="22" cy="22" r="13"/>
          <circle class="s-ring" cx="22" cy="22" r="6"/>
          <path class="s-sweep" d="M22 22 L22 1 A21 21 0 0 1 40 12 Z"/>
          <circle class="s-dot" cx="22" cy="22" r="2.8"/>
        </svg>
      </span>
      <span class="word">InternDoor</span>
    </div>
    <div class="status"><i></i><span id="status">Updated every 30 minutes</span></div>
  </div>

  <div class="hero" id="slot">
    <h1>Engineering internships &amp; entry-level jobs</h1>
    <p>Listed within minutes of going live, so you can apply <b>while the queue is still short.</b></p>
  </div>

  <div class="foot" id="foot">
    <span class="pill">Free</span>
    <span class="pill">No signup</span>
    <span class="pill">Every listing links to the original</span>
    <span class="spacer"></span>
    <span class="go">Browse roles <span aria-hidden="true">→</span></span>
  </div>
</div>

<script>
/* Fill the card for ONE posting. src/ogcard.js loads this page once and calls
   renderJob for posting after posting on the same page, so this rebuilds
   everything it touches. Called after document.fonts.ready: measuring before
   the webfonts land measures the fallback face, and the real one overflows. */
const PAY = /[₹$€£]|\/\s*(month|year|week|hour)/i;

window.renderJob = function (job) {
  const card = document.getElementById('card');
  card.classList.add('is-job');
  document.getElementById('status').textContent = 'Hiring now';

  /* The panel takes the hero's place and the footer moves inside it, so the
     card reads exactly like a role on the board. */
  const old = document.getElementById('slot');
  const panel = document.createElement('div');
  panel.className = 'panel'; panel.id = 'slot';

  const who = document.createElement('div'); who.className = 'who';
  const plate = document.createElement('div'); plate.className = 'plate';
  if (job.logo) {
    const img = document.createElement('img'); img.src = job.logo; img.alt = ''; plate.appendChild(img);
  } else {
    /* Initials, never an empty box (the site's crest does the same). */
    plate.classList.add('none');
    const s = document.createElement('span');
    s.textContent = String(job.company || '').replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/)
      .filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    plate.appendChild(s);
  }
  const txt = document.createElement('div'); txt.className = 'txt';
  const co = document.createElement('div'); co.className = 'co'; co.textContent = job.company || '';
  const h = document.createElement('h1'); h.className = 'role'; h.textContent = job.title || '';
  txt.append(co, h);
  who.append(plate, txt);

  const foot = document.createElement('div'); foot.className = 'foot';
  for (const f of (job.facts || []).slice(0, 3)) {
    const p = document.createElement('span');
    p.className = PAY.test(f) ? 'pill pay' : 'pill';
    p.textContent = f;
    foot.appendChild(p);
  }
  const sp = document.createElement('span'); sp.className = 'spacer'; foot.appendChild(sp);
  const u = document.createElement('span'); u.className = 'url'; u.textContent = 'interndoor.com'; foot.appendChild(u);
  const go = document.createElement('span'); go.className = 'go'; go.innerHTML = 'View &amp; apply <span aria-hidden="true">→</span>';
  foot.appendChild(go);

  panel.append(who, foot);
  old.replaceWith(panel);
  const outer = document.getElementById('foot');
  if (outer) outer.remove();

  /* SHRINK UNTIL IT FITS, checking WIDTH as well as height: one unbreakable
     token runs off the side without ever growing the block. Height is measured
     against the CEILING read from computed style, never against clientHeight
     (an auto-height block's clientHeight is its own content). Checked at the
     size that is applied. */
  const ceiling = parseFloat(getComputedStyle(txt).maxHeight) || Infinity;
  const room = () => txt.scrollHeight <= ceiling + 0.5 && h.scrollWidth <= h.clientWidth;
  let size = 70;
  h.style.fontSize = size + 'px';
  while (size > 30 && !room()) {
    size -= 4;
    h.style.fontSize = size + 'px';
  }
  return { fontSize: h.style.fontSize };
};
</script>
